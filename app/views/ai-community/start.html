<style>
.character {
  position: fixed;
  bottom: 0;
  width: 200px;
  transform-origin: bottom center;
  pointer-events: none;
  padding-bottom: 10px;
}

.character.left { left: 0; }
.character.right { right: 0; }

.character img {
  width: 100%;
  transition: transform 0.3s ease-out;
}
</style>

<script>
document.addEventListener("mousemove", (e) => {
  const mouseX = e.clientX;
  const mouseY = e.clientY;

  const rotateTowardMouse = (img) => {
    const rect = img.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height; // bottom of image (neck)
    const angle = Math.atan2(mouseY - centerY, mouseX - centerX);
    const degrees = angle * (180 / Math.PI);
    img.style.transform = `rotate(${degrees}deg)`;
  };

  rotateTowardMouse(document.getElementById("charLeft"));
  rotateTowardMouse(document.getElementById("charRight"));
});
</script>

<style>
  /* =========================================================
   DIGIT BOXES
   ========================================================= */

  .digit-box {
    width: 50px;
    height: 60px;
    font-size: 28px;
    text-align: center;

   FAILURE SCREEN
   ========================================================= */

  #failureScreen {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: black;
    color: #ff0055;
    font-size: 70px;
    font-weight: bold;
    letter-spacing: 8px;

    opacity: 0;
    pointer-events: none;
    z-index: 99999;

    text-shadow:
      2px 0 #00ffff,
      -2px 0 #ff0055;
  }

  #failureScreen.active {
    opacity: 1;
    animation: glitchExplode 0.6s infinite;
  }

  /* =========================================================
   ✅ SUCCESS SCREEN (ADDED)
   ========================================================= */

  #successScreen {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #001a10;
    color: #00ff88;
    font-size: 80px;
    font-weight: 900;
    letter-spacing: 10px;

    opacity: 0;
    pointer-events: none;
    z-index: 99999;

    text-shadow:
      2px 0 #00ffff,
      -2px 0 #00ff88;
  }

  #successScreen.active {
    opacity: 1;
    animation: successGlitch 0.5s infinite;
  }

  @keyframes successGlitch {
    0% { transform: translate(0,0); filter: hue-rotate(0deg); }
    25% { transform: translate(-3px,2px); }
    50% { transform: translate(3px,-2px); filter: hue-rotate(60deg); }
    75% { transform: translate(-2px,-1px); }
    100% { transform: translate(0,0); filter: hue-rotate(0deg); }
  }

  @keyframes glitchExplode {
    0% { transform: scale(1) translate(0, 0); }
    25% { transform: scale(1.05) translate(5px, -3px); }
    50% { transform: scale(0.98) translate(-5px, 3px); }
    75% { transform: scale(1.08) translate(6px, 2px); }
    100% { transform: scale(1) translate(0, 0); }
  }

  #riddle {
    white-space: pre-line;
  }
</style>

<script>
  /* =========================================================
     STAGES
     ========================================================= */

  const stages = [
    {
      riddle: `I am a book that has no page,
I speak in light instead of age.

I live where fingers start to type,
and wake when tapped, both wrong and right.`,
      code: "4821"
    },
    {
      riddle: `With pointed fangs I sit and wait;
with piercing force I crunch out fate;
grabbing victims, proclaiming might;
physically joining with a single bite.`,
      code: "1934"
    },
    {
      riddle: `I have lakes with no water,
mountains with no stone,
and cities with no buildings.
What am I?`,
      code: "5072"
    },
    {
      riddle: `Every night I’m told what to do,
and each morning I do what I’m told.
But I still don’t escape your scold.
What am I?`,
      code: "6408"
    },
    {
      riddle: `What invention lets you look right through a wall?`,
      code: "9143"
    },
    {
      riddle: `Where is the only place where today comes before yesterday?`,
      code: "2210"
    }
  ];

  let stage = 0;

  const riddleEl = document.getElementById("riddle");
  const inputs = document.querySelectorAll(".digit-box");
  const button = document.getElementById("submitBtn");
  const failureScreen = document.getElementById("failureScreen");
  const successScreen = document.getElementById("successScreen");

  function loadStage() {
    riddleEl.textContent = stages[stage].riddle;
    inputs.forEach(i => i.value = "");
    inputs[0].focus();
  }

  loadStage();

  /* input handling */
  inputs.forEach((input, i) => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/[^0-9]/g, "");
      if (input.value && i < inputs.length - 1) {
        inputs[i + 1].focus();
      }
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !input.value && i > 0) {
        inputs[i - 1].focus();
      }
    });
  });

  /* =========================================================
     SUBMIT
     ========================================================= */

  button.addEventListener("click", () => {
    const code = Array.from(inputs).map(i => i.value).join("");

    if (code === stages[stage].code) {
      triggerSuccess();
    } else {
      triggerFailure();
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") button.click();
  });

  /* =========================================================
     SUCCESS (ADDED)
     ========================================================= */

  function triggerSuccess() {
    successScreen.classList.add("active");

    setTimeout(() => {
      successScreen.classList.remove("active");

      stage++;

      if (stage >= stages.length) {
        window.location.href = "final-question";
      } else {
        loadStage();
      }

    }, 2000);
  }

  /* =========================================================
     FAILURE
     ========================================================= */

  function triggerFailure() {
    failureScreen.classList.add("active");

    document.body.style.filter = "contrast(2) hue-rotate(90deg)";

    setTimeout(() => {
      window.location.href = "start.html";
    }, 3000);
  }
</script>
